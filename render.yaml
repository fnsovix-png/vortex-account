services:
  - type: web
    name: vortex-account
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 8000
      - key: VORTEX_DATA
        value: /data
      - key: VORTEX_ALLOW_SIGNUP
        value: "1"
      # Upstash Redis keeps the account database and files across restarts,
      # because the free plan has no persistent disk.
      - key: VORTEX_REDIS_URL
        value: rediss://default:gQAAAAAAAxhJAQIgcDE3MzIzMWZkMmUyZTM0MDYyOThmYTRiYWViMDRiZTRkOA@precise-grub-202825.upstash.io:6379
      # YouTube bot-walls this host's IP; this is the cookie file, base64.
      - key: VORTEX_YT_COOKIES_B64
        value: 
